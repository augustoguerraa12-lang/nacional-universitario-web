<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nacional Universitario · El más laureado</title>
<meta name="description" content="Club Nacional de Football Universitario. 26 títulos de la Divisional A de la Liga Universitaria de Deportes. Desde 1966.">
<link rel="icon" href="assets/escudo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#0E1726;font-family:Inter,system-ui,sans-serif}
a{color:#003B81}a:hover{color:#F7152D}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box}
.nav a{color:#FFFFFF;text-decoration:none}.nav a:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#F7152D}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#0E1726}
.field input,.field select{min-height:46px;border:1px solid #D9E1EC;border-radius:10px;padding:0 14px;font:inherit;font-weight:400;font-size:15px;background:#FFFFFF;color:#0E1726}
.field input:focus,.field select:focus,.btn:focus-visible,button:focus-visible{outline:2px solid #F7152D;outline-offset:2px}
body{cursor:url(assets/cursor.svg) 14 14,auto}
a,button,label,select,input[type=submit]{cursor:url(assets/cursor_link.svg) 18 18,pointer}
.btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(0,20,46,.55);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.96)}
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-6px)}
.card:active{transform:translateY(-2px) scale(.99)}
article{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
article:hover{transform:translateY(-6px);box-shadow:0 22px 40px -24px rgba(0,20,46,.6)}
.nav a{position:relative}.nav nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#F7152D;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav nav a:hover{text-decoration:none!important}.nav nav a:hover::after{transform:scaleX(1)}
[role=tab]{transition:background .2s,color .2s,transform .15s}[role=tab]:active{transform:scale(.95)}
.fila{transition:background .2s,transform .2s}.fila:hover{transform:translateX(4px)}
@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.h1{animation:subir .8s cubic-bezier(.2,.8,.2,1) both}
.panel{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.panel:hover{transform:scale(1.005)}
@media (max-width:760px){.panel{width:calc(100% - 20px)!important;border-radius:28px!important}}
.tile{transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.cinta{position:relative;overflow:hidden;padding-block:30px;display:flex;flex-direction:column;gap:6px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)}
.cinta .tira{overflow:hidden;box-shadow:0 16px 34px -22px rgba(0,20,46,.7)}
.cinta .tira.roja{background:linear-gradient(90deg,#C90F24,#F7152D 50%,#C90F24)}
.cinta .tira.azul{background:linear-gradient(90deg,#003B81,#1D5FB8 50%,#003B81)}
.cinta .pista{display:flex;width:max-content;animation:correr 60s linear infinite}
.cinta .pista.vuelta{animation-direction:reverse;animation-duration:48s}
.cinta .grupo{display:flex;align-items:center;gap:28px;padding:14px 28px 14px 0;white-space:nowrap;font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase;color:#FFFFFF}
.cinta .grupo img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.cinta .tira.azul .grupo{font-size:26px;padding-block:11px}
.cinta .tira.azul .grupo img{width:26px;height:26px}
.ondas{position:relative;height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
.ondas .onda{position:absolute;left:0;top:5px;width:200%;height:140px;animation:correr 22s linear infinite}
.ondas .onda svg{width:100%;height:100%;display:block}
.ondas .o2{animation-duration:15s;animation-direction:reverse}
.ondas .o3{animation-duration:30s;opacity:.8}
.ondas .brillo{position:absolute;top:0;bottom:0;width:220px;left:-240px;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));animation:barrer 7s ease-in-out infinite}
@keyframes barrer{0%{transform:translateX(0)}60%,100%{transform:translateX(calc(100vw + 480px))}}
.galeria{position:relative;overflow:hidden;padding-block:56px 70px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.galeria-pista{display:flex;width:max-content;animation:correr 80s linear infinite}
.galeria-grupo{display:flex;gap:22px;padding-right:22px}
.foto-cinta{margin:0;width:250px;height:320px;border-radius:20px;overflow:hidden;box-shadow:0 24px 40px -24px rgba(0,20,46,.65);transform:rotate(-2.5deg);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.foto-cinta:nth-child(even){transform:rotate(2.5deg) translateY(22px)}
.foto-cinta:hover{transform:rotate(0) scale(1.04)}
.foto-cinta img{width:100%;height:100%;object-fit:cover;display:block}
.galeria:hover .galeria-pista{animation-play-state:paused}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cifra{display:flex;flex-direction:column;gap:8px;padding:6px 28px 6px 24px;border-left:2px solid rgba(255,255,255,.35)}
.cifra:first-child{border-left-color:#FFFFFF}
@media (max-width:760px){.foto-cinta{width:170px;height:220px}.cifra{padding-block:14px}}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes aparecer{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@supports (animation-timeline:view()){section>.wrap{animation:aparecer linear both;animation-timeline:view();animation-range:entry 0% entry 35%}}
.drop{display:flex;align-items:center;gap:14px;border:1.5px dashed #B9C8DE;border-radius:14px;padding:14px 16px;background:#F7F9FD;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover{border-color:#003B81;background:#EEF3FA}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.vitrina{position:relative;border-radius:22px;padding:30px 26px 18px;background:linear-gradient(180deg,#0E3170 0%,#072250 55%,#04173A 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 30px 60px -30px rgba(255,236,200,.25),0 0 0 9px #061A3B,0 0 0 10px rgba(255,255,255,.16),0 50px 90px -40px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:22px;overflow:hidden}
.vitrina::before{content:"";position:absolute;left:6%;right:6%;top:0;height:3px;border-radius:0 0 6px 6px;background:#FFF6E0;box-shadow:0 0 18px 4px rgba(255,236,190,.55),0 0 60px 14px rgba(255,236,190,.18)}
.vitrina::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 22%,rgba(255,255,255,.07) 30%,transparent 38%,transparent 64%,rgba(255,255,255,.05) 69%,transparent 74%)}
.estante{position:relative}
.fila-copas{display:flex;justify-content:center;flex-wrap:wrap}
.copa{position:relative;flex:0 0 calc(100% / 9);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:14px;text-decoration:none}
.copa .foco{position:absolute;left:50%;top:-30px;width:150%;height:150%;transform:translateX(-50%);background:radial-gradient(50% 55% at 50% 12%,rgba(255,236,190,.34),rgba(255,236,190,0) 70%);pointer-events:none;transition:opacity .3s}
.copa img{position:relative;height:132px;width:auto;filter:drop-shadow(0 10px 10px rgba(0,0,0,.55)) brightness(1.08) saturate(1.1);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s}
.copa:hover img{transform:translateY(-8px) scale(1.06);filter:drop-shadow(0 18px 16px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,220,150,.45)) brightness(1.18) saturate(1.2)}
.copa:hover .foco{opacity:1!important}
.placa{position:relative;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 8px 5px;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.placa b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;line-height:1.1;letter-spacing:.03em}
.placa small{font-size:9px;font-weight:700;letter-spacing:.14em;opacity:.8}
.tabla-vidrio{height:12px;margin-top:-2px;border-radius:3px;background:linear-gradient(180deg,rgba(220,235,255,.55),rgba(160,190,235,.16) 45%,rgba(255,255,255,.06));box-shadow:0 14px 20px -8px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.7)}
@media (max-width:760px){.copa{flex-basis:calc(100% / 4)}.copa img{height:96px}.vitrina{padding:22px 10px 14px}}
@media (prefers-reduced-motion:reduce){.copa img{transition:none}}
.franja{height:6px;background:linear-gradient(90deg,#003B81 0 33.3%,#FFFFFF 33.3% 66.6%,#F7152D 66.6%)}
@media (max-width:760px){.navlinks{display:none!important}.h1{font-size:76px!important}.h2{font-size:40px!important}.copa{display:none!important}}
@media (prefers-reduced-motion:reduce){.tile,.btn,.card,article,.fila,[role=tab]{transition:none}.h1,.cinta .pista,.galeria-pista,.ondas .onda,.ondas .brillo,section>.wrap{animation:none!important}}
@media (max-width:760px){.cinta .grupo{font-size:24px}.cinta .tira.azul .grupo{font-size:19px}}
</style>

</head>
<body>
<template id="t">
<div style="display:flex;flex-direction:column;width:100%;overflow:hidden">

<header style="background:#003B81;color:#FFFFFF">
  <div class="wrap nav" style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;min-height:72px">
    <span aria-hidden="true"></span>
    <nav class="navlinks" aria-label="Secciones" style="display:flex;justify-content:center;gap:34px;font-size:15px;font-weight:600;letter-spacing:.02em;flex-wrap:wrap">
      <a href="#partidos">Partidos</a><a href="#club">El club</a><a href="#muro">Títulos</a><a href="#plantel">Plantel</a><a href="#socios">Socios</a><a href="#tienda">Tienda</a><a href="#sumate">Sumate</a>
    </nav>
    <a class="btn" href="#tienda" style="justify-self:end;background:#FFFFFF;color:#003B81;min-height:40px;font-size:14px">Pedido · {{carrito}}</a>
  </div>
</header>
<div class="franja"></div>

<section id="inicio" style="position:relative;background:#00142E;color:#FFFFFF;min-height:720px;display:flex;flex-direction:column;justify-content:flex-end">
  <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;background:#00142E">
  <sc-for list="{{hero}}" as="h" hint-placeholder-count="4">
    <img src="{{h.src}}" alt="{{h.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;opacity:{{h.op}};transform:scale({{h.esc}});transform-origin:center;transition:opacity 1.4s ease,transform 7s ease-out">
  </sc-for>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,20,46,.92) 0%,rgba(0,20,46,.72) 38%,rgba(0,20,46,.15) 72%,rgba(0,20,46,0) 100%)"></div>
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(0,20,46,0),rgba(0,20,46,.85))"></div>
  <div aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,#003B81 0 33.3%,#FFFFFF 33.3% 66.6%,#F7152D 66.6%)"></div>
  <div class="wrap" style="position:relative;width:100%;display:flex;flex-direction:column;gap:26px;padding-block:96px 56px">
    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <img src="assets/escudo.png" alt="Escudo del Club Nacional de Football Universitario" style="width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))">
      <div style="display:flex;flex-direction:column;gap:6px;border-left:2px solid rgba(255,255,255,.35);padding-left:22px">
        <span style="font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFFFFF">Club Nacional de Football Universitario</span>
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#BFD0EA">Fundado en 1966 · Liga Universitaria de Deportes</span>
      </div>
    </div>
    <h1 class="h1" style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:136px;line-height:1.02;text-transform:uppercase;letter-spacing:.025em;text-shadow:0 6px 30px rgba(0,0,0,.35)">El más<br>laureado</h1>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <span style="display:inline-block;width:56px;height:4px;background:#F7152D"></span>
      <p style="margin:0;max-width:54ch;font-size:19px;line-height:1.5;color:#EAF0F9">Veintiséis veces campeón de la Divisional A. Bicampeón 2023 y 2024.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="#sumate" style="background:#F7152D;color:#FFFFFF">Sumate al club</a>
      <a class="btn" href="#tienda" style="background:rgba(255,255,255,.12);color:#FFFFFF;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)">Tienda oficial</a>
    </div>
  </div>
  <div class="wrap" style="position:relative;z-index:2;width:100%;margin-bottom:-72px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
      <a class="card" href="#partidos" style="display:flex;flex-direction:column;gap:14px;padding:20px 22px;border-radius:18px;text-decoration:none;background:#FFFFFF;color:#0E1726;box-shadow:0 18px 40px -18px rgba(0,20,46,.55);border-top:5px solid #F7152D">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#F7152D">Próximo partido</span><span style="font-size:12px;font-weight:600;color:#4A5870">Mayores A · Fecha 6</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <img src="assets/escudo-tenis-el-pinar.png" alt="Tenis El Pinar" style="width:46px;height:46px;object-fit:contain">
          <div style="display:flex;flex-direction:column;align-items:center;line-height:1"><span style="font-family:Anton,Impact,sans-serif;font-size:30px;color:#003B81">09:00</span><span style="font-size:12px;color:#4A5870;margin-top:4px">Domingo 01/11</span></div>
          <img src="assets/escudo.png" alt="" style="width:46px;height:46px;object-fit:contain">
        </div>
        <span style="font-size:13px;font-weight:600;text-align:center">Tenis El Pinar vs Nacional U.</span>
      </a>
      <a class="card" href="#partidos" style="display:flex;flex-direction:column;gap:14px;padding:20px 22px;border-radius:18px;text-decoration:none;background:#003B81;color:#FFFFFF;box-shadow:0 18px 40px -18px rgba(0,20,46,.7);border-top:5px solid #FFFFFF">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BFD0EA">Último resultado</span><span style="font-size:11px;font-weight:800;background:#FFFFFF;color:#003B81;border-radius:999px;padding:3px 9px">EMPATÓ</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <img src="assets/escudo.png" alt="" style="width:46px;height:46px;object-fit:contain;background:#FFFFFF;border-radius:50%;padding:4px;box-sizing:border-box">
          <span style="font-family:Anton,Impact,sans-serif;font-size:38px;line-height:1;font-variant-numeric:tabular-nums">0 <span style="color:#F7152D">–</span> 0</span>
          <img src="assets/escudo-old-woodlands.png" alt="Old Woodlands" style="width:46px;height:46px;object-fit:contain;background:#FFFFFF;border-radius:50%;padding:4px;box-sizing:border-box">
        </div>
        <span style="font-size:13px;font-weight:600;text-align:center;color:#DCE7F7">Nacional U. vs Old Woodlands · Fecha 5</span>
      </a>
      <a class="card" href="#partidos" style="display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:18px;text-decoration:none;background:#FFFFFF;color:#0E1726;box-shadow:0 18px 40px -18px rgba(0,20,46,.55);border-top:5px solid #003B81">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#003B81">Tabla</span><span style="font-size:12px;font-weight:600;color:#4A5870">Temporada 2026</span></div>
        <div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:Anton,Impact,sans-serif;font-size:44px;line-height:1;color:#003B81">5<span style="font-family:Inter,sans-serif;font-weight:800;font-size:22px;vertical-align:top;margin-left:2px">º</span></span><span style="font-size:15px;font-weight:700">33 puntos</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="height:8px;border-radius:999px;background:#EEF3FA;overflow:hidden"><div style="width:82.5%;height:100%;background:linear-gradient(90deg,#003B81,#F7152D);border-radius:999px"></div></div><span style="font-size:12px;color:#4A5870">A 7 puntos del líder, Old Woodlands (40)</span></div>
      </a>
    </div>
  </div>
</section>

<section id="partidos" style="background:#FFFFFF">
  <div class="wrap" style="display:flex;flex-direction:column;gap:24px;padding-block:128px 64px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Partidos</span><h2 class="h2" style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:48px;text-transform:uppercase;color:#003B81">Mayores A · Temporada 2026</h2></div>
      <span style="font-size:13px;color:#4A5870">Presentado por <b>[Sponsor principal]</b></span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:stretch">
      <div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px">
        <div style="background:#003B81;color:#FFFFFF;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:22px;border-bottom:6px solid #F7152D">
          <span style="font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BFD0EA">Próximo partido</span>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center">
              <img src="assets/escudo-tenis-el-pinar.png" alt="" style="width:64px;height:64px;object-fit:contain;background:#FFFFFF;border-radius:50%;padding:6px;box-sizing:border-box">
              <span style="font-weight:600;font-size:15px">Tenis El Pinar</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
              <span style="font-family:Anton,Impact,sans-serif;font-size:42px;line-height:1">09:00</span>
              <span style="font-size:13px;color:#BFD0EA">Domingo 01/11</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center">
              <img src="assets/escudo.png" alt="" style="width:64px;height:64px;object-fit:contain;background:#FFFFFF;border-radius:50%;padding:6px;box-sizing:border-box">
              <span style="font-weight:600;font-size:15px">Nacional U.</span>
            </div>
          </div>
        </div>
        <div style="background:#F4F7FC;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px">
          <span class="eyebrow" style="color:#003B81">Últimos resultados</span>
          <sc-for list="{{resultados}}" as="r" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:12px;font-size:15px">
              <span style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:{{r.bg}};color:#FFFFFF">{{r.letra}}</span>
              <img src="{{r.esc}}" alt="" style="width:26px;height:26px;object-fit:contain"><span style="flex:1;min-width:0">vs {{r.rival}}</span>
              <span style="font-weight:700;font-variant-numeric:tabular-nums">{{r.marcador}}</span>
            </div>
          </sc-for>
        </div>

<section id="tienda" style="background:linear-gradient(180deg,#FFFFFF 0%,#F2F6FC 14%,#F2F6FC 86%,#FFFFFF 100%)">
  <div class="wrap" style="display:flex;flex-direction:column;gap:24px;padding-block:80px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:12px;max-width:620px">
        <span class="eyebrow">Tienda NU</span>
        <h2 class="h2" style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:52px;line-height:1;text-transform:uppercase;color:#003B81">Llevá la camiseta</h2>
        <p style="margin:0;font-size:16px;line-height:1.6;color:#33445E">Lo que está en stock se retira en el club. Lo que está en preventa se fabrica cuando se junta el mínimo de pedidos. Socios y jugadores: [X] % de descuento.</p>
      </div>
      <div role="tablist" aria-label="Tipo de venta" style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" role="tab" onClick="{{verStock}}" class="btn" style="background:{{tabStockBg}};color:{{tabStockFg}};border:1px solid #003B81">En stock</button>
        <button type="button" role="tab" onClick="{{verPreventa}}" class="btn" style="background:{{tabPreBg}};color:{{tabPreFg}};border:1px solid #003B81">Preventa</button>
      </div>
    </div>

    <sc-if value="{{esStock}}" hint-placeholder-val="{{true}}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
        <sc-for list="{{stock}}" as="p" hint-placeholder-count="4">
          <article style="background:#FFFFFF;border-radius:18px;overflow:hidden;display:flex;flex-direction:column">
            <sc-if value="{{p.tieneFoto}}" hint-placeholder-val="{{true}}">
              <img src="{{p.foto}}" alt="{{p.nombre}}" style="width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top;display:block">
            </sc-if>
            <sc-if value="{{p.sinFoto}}" hint-placeholder-val="{{false}}">
              <div style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:{{p.fondo}}">
                <svg viewBox="0 0 200 200" width="70%" aria-hidden="true"><path d="M70 30 L40 42 L14 72 L36 92 L52 78 L52 176 L148 176 L148 78 L164 92 L186 72 L160 42 L130 30 Q100 52 70 30 Z" fill="{{p.tela}}"/><text x="100" y="118" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="{{p.tam}}" fill="{{p.tinta}}">{{p.leyenda}}</text><text x="100" y="146" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="{{p.tinta2}}">{{p.sub}}</text></svg>
              </div>
            </sc-if>
            <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-size:16px">{{p.nombre}}</b><span style="font-family:Anton,Impact,sans-serif;font-size:20px;color:#003B81">[PRECIO]</span></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap" aria-label="Talles disponibles">
                <sc-for list="{{p.talles}}" as="t" hint-placeholder-count="4">
                  <span style="min-width:38px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:700;background:{{t.bg}};color:{{t.fg}};text-decoration:{{t.tachado}}">{{t.t}}</span>
                </sc-for>
              </div>
              <button type="button" onClick="{{p.agregar}}" class="btn" style="background:#003B81;color:#FFFFFF;width:100%">Lo quiero</button>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{esPreventa}}" hint-placeholder-val="{{false}}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
        <sc-for list="{{preventa}}" as="p" hint-placeholder-count="3">
          <article style="background:#FFFFFF;border-radius:18px;overflow:hidden;display:flex;flex-direction:column">
            <div style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:{{p.fondo}};position:relative">
              <span style="position:absolute;top:14px;left:14px;border-radius:999px;padding:6px 12px;background:#F7152D;color:#FFFFFF;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase">Preventa</span>
              <svg viewBox="0 0 200 200" width="70%" aria-hidden="true"><path d="M70 30 L40 42 L14 72 L36 92 L52 78 L52 176 L148 176 L148 78 L164 92 L186 72 L160 42 L130 30 Q100 52 70 30 Z" fill="{{p.tela}}"/><path d="M52 112 L148 82 L148 104 L52 134 Z" fill="{{p.franja}}"/><text x="100" y="164" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="20" fill="{{p.tinta}}">{{p.anio}}</text></svg>
            </div>
            <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-size:16px">{{p.nombre}}</b><span style="font-family:Anton,Impact,sans-serif;font-size:20px;color:#003B81">[PRECIO]</span></div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <div style="height:8px;border-radius:999px;background:#E3EBF7;overflow:hidden"><div style="height:100%;width:{{p.avance}};background:#F7152D;border-radius:999px"></div></div>
                <span style="font-size:13px;color:#33445E"><b>[N] de [mínimo]</b> pedidos para mandarla a hacer</span>
              </div>
              <button type="button" onClick="{{p.agregar}}" class="btn" style="background:#F7152D;color:#FFFFFF;width:100%">Reservar la mía</button>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hayMensaje}}" hint-placeholder-val="{{false}}">
      <div role="status" style="align-self:flex-start;border-radius:12px;padding:12px 16px;background:#003B81;color:#FFFFFF;font-size:14px">{{mensaje}}</div>
    </sc-if>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding-top:8px">
      <sc-for list="{{pasos}}" as="s" hint-placeholder-count="3">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span style="flex:none;width:34px;height:34px;border-radius:10px;background:#003B81;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:18px">{{s.n}}</span>
          <div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">{{s.titulo}}</b><span style="font-size:14px;color:#33445E;line-height:1.5">{{s.texto}}</span></div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section id="sumate" class="panel" style="width:calc(100% - 48px);max-width:1360px;align-self:center;margin-block:28px;border-radius:40px;overflow:hidden;box-shadow:0 40px 80px -48px rgba(0,20,46,.55);background:radial-gradient(120% 140% at 90% 100%,#1D5FB8 0%,#003B81 45%,#00142E 100%);color:#FFFFFF">
  <div class="wrap" style="display:flex;flex-wrap:wrap;gap:48px;padding-block:80px;align-items:flex-start">
    <div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px">
      <span class="eyebrow" style="color:#FFB4BC">Sumate a jugar</span>
      <h2 class="h2" style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:56px;line-height:1.08;text-transform:uppercase;text-wrap:balance">¿Llegás a Montevideo a estudiar? Acá tenés equipo.</h2>
      <p style="margin:0;font-size:16px;line-height:1.6;color:#DCE7F7;max-width:44ch">Seas de Montevideo o del interior, dejanos tus datos y el cuerpo técnico de tu categoría te escribe para venir a entrenar. Martes a jueves, de 20 a 22 h.</p>
    </div>
    <form onSubmit="{{enviar}}" style="flex:1 1 440px;min-width:0;background:#FFFFFF;color:#0E1726;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:16px;border-bottom:6px solid #F7152D">
      <sc-if value="{{enviado}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:8px;padding:28px 0;text-align:center;align-items:center">
          <span style="font-family:Anton,Impact,sans-serif;font-size:36px;color:#003B81;text-transform:uppercase">¡Gracias!</span>
          <span style="font-size:15px;color:#33445E">Te escribimos por WhatsApp esta semana.</span>
        </div>
      </sc-if>
      <sc-if value="{{noEnviado}}" hint-placeholder-val="{{true}}">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
          <label class="field" for="nombre">Nombre y apellido<input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required=""></label>
          <label class="field" for="edad">Edad<input id="edad" name="edad" type="number" min="14" max="60" placeholder="21" required=""></label>
          <label class="field" for="origen">¿De dónde sos?<input id="origen" name="origen" type="text" placeholder="Ej.: Tacuarembó"></label>
          <label class="field" for="puesto">Puesto<select id="puesto" name="puesto"><option>Arquero</option><option>Defensor</option><option>Lateral</option><option>Volante</option><option>Extremo</option><option>Delantero</option></select></label>
          <label class="field" for="categoria">Categoría<select id="categoria" name="categoria"><option>Sub-16</option><option>Sub-18</option><option>Sub-20</option><option>Reserva</option><option>Mayores</option><option>Pre-senior</option></select></label>
          <label class="field" for="whatsapp">WhatsApp<input id="whatsapp" name="whatsapp" type="tel" placeholder="09X XXX XXX" required=""></label>
        </div>
        <label class="drop" for="video" style="position:relative">
          <span style="flex:none;width:44px;height:44px;border-radius:12px;background:#003B81;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h7A2.5 2.5 0 0 1 16 6.5v1.8l4-2.3v12l-4-2.3v1.8a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 17.5z" fill="#FFFFFF"/></svg></span>
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <b style="font-size:14px;color:#0E1726">{{videoTitulo}}</b>
            <span style="font-size:13px;color:#4A5870;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{videoDetalle}}</span>
          </span>
          <span style="margin-left:auto;font-size:13px;font-weight:700;color:#F7152D;flex:none">{{videoAccion}}</span>
          <input id="video" name="video" type="file" accept="video/*" onChange="{{elegirVideo}}">
        </label>
        <button type="submit" class="btn" style="background:#F7152D;color:#FFFFFF;width:100%">Quiero probarme</button>
      </sc-if>
    </form>
  </div>
</section>

<footer style="background:linear-gradient(180deg,#FFFFFF 0%,#00142E 18%);color:#BFD0EA;padding-top:60px">
  <div class="wrap" style="display:flex;flex-direction:column;gap:24px;padding-block:44px 32px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase">Nos acompañan</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
        <sc-for list="{{sponsors}}" as="s" hint-placeholder-count="5">
          <div style="min-height:64px;border-radius:12px;border:1px dashed rgba(191,208,234,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center;padding:8px">
            <b style="color:#FFFFFF;font-size:13px">{{s.nombre}}</b><span>{{s.nivel}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:20px;border-top:1px solid rgba(191,208,234,.2);font-size:13px">
      <div style="display:flex;align-items:center;gap:10px"><img src="assets/escudo.png" alt="" style="width:30px;height:30px;object-fit:contain"><span>Club Nacional de Football Universitario · El más laureado</span></div>
      <span>@nacionaluniversitario · Liga Universitaria de Deportes</span>
    </div>
  </div>
</footer>
